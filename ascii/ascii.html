<br /> <br />

<pre>⭐ <a target="_blank" href="https://github.com/mgurga/itch">itch</a> - Modern C++ emulator for Scratch 3 projects.</pre>

<br /><pre>|      C++      |     SFML      |    OpenGL     |      CLI      |     GTest     |</pre> <br />

<pre>I originially started the project as a way of running Scratch projects faster and avoiding javascript,</pre> <br />
<pre>but I ended up colaborating with other members in the community and combing over the <a href="https://github.com/scratchfoundation/scratch-vm">native implementation.</a></pre> <br />
<pre>Itch also includes a visual debugging interface that provides fine tuned control over the engine.</pre> <br />
<pre>Scratch many quarks, yet itch supports the large marjority of instructions.</pre> <br />

<br />

<pre>⭐ <a target="_blank" href="https://github.com/mgurga/lineinradio">lineinradio</a> - 24/7 community ran online radio station.</pre>

<br /><pre>|    Python     |    Django     |   Fullstack   |   Streaming   |     CRUD      |    SQLite     |   Templates   |</pre><br />

<pre>Online radio station with shows submitted by users. Shows can be any length and customized to play</pre><br />
<pre>at certain times of day. Every night, the server will automatically generate a schedule for the day.</pre><br />
<pre>DJs are able customize their profiles by changing backgrounds, text color, banners, an profile pictures.</pre><br />

<a target="_blank" href="https://lineinradio.xyz/">[ Tune In ]</a> <br />

<br />

<pre>⭐ <a target="_blank" href="https://github.com/mgurga/repmap">RepMap</a>, <a target="_blank" href="https://github.com/mgurga/repapi">repapi</a> - Interactive map to find your state representatives.</pre>

<br /><pre>|    Android    |     Java      |    Python     | OpenStreetMap |      API      |    Scraper    |</pre><br />

<pre>RepMap was a collaborative submission to the Congressional App Contest that makes it easier to find </pre><br />
<pre>your representative. The Android app displays an interactive OpenStreetMap display of the United States </pre><br />
<pre>and the API converts the coordinates to zipcodes to districts. This data is formatted into an ordered </pre><br />
<pre>list on the app. Our submission earned us 2nd place in our district. </pre><br />
