name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          cat >>~/.ssh/config <<END
          Host vps
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/vps.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install dependencies
        run: go get .

      - name: Build
        run: go build -v

      - name: Copy to VPS
        run: scp ./mgurga.xyz vps:/home/mgurga/mgurga.xyz

      - name: Restart web server
        run: ssh vps 'systemctl restart personalwebsite'